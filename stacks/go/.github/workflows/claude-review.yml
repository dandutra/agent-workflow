# Claude Code as the PR reviewer, on the subscription's limits.
# Setup: run `claude setup-token` locally and store the result as the repo
# secret CLAUDE_CODE_OAUTH_TOKEN. An agent's approval never counts as a person's.
name: Claude review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Fork PRs get no secrets, so they skip rather than fail.
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review PR #${{ github.event.pull_request.number }} against REVIEW.md and CLAUDE.md, and the docs they link to.
            Follow REVIEW.md: start with the count and the risk tier, tag each finding, cite file:line,
            skip what CI already checks, and cap Nits at 5. Post one PR comment with gh.
          claude_args: |
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Bash(git diff:*),Bash(git log:*),Read,Grep,Glob"
